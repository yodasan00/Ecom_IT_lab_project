<!DOCTYPE html>
<html>
<head>
    <title>Book List</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
    <h1 class="mb-3">📚 Book List</h1>

    <a href="{% url 'add_book' %}" class="btn btn-primary mb-3">➕ Add Book</a>

    {% if books %}
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Book Name</th>
                    <th>Author Name</th>
                    <th>Price (₹)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for book in books %}
                <tr>
                    <td>{{ book.book_name }}</td>
                    <td>{{ book.author_name }}</td>
                    <td>{{ book.price }}</td>
                    <td>
                        <a href="{% url 'edit_book' book.pk %}" class="btn btn-sm btn-warning">✏ Edit</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No books found.</p>
    {% endif %}
</body>
</html>
