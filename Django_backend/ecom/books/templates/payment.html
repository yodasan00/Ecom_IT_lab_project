<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Payment</title>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
            background-color: #f8f8f8;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ddd;
            max-width: 500px;
            margin: 40px auto;
        }
        h1, h3 {
            text-align: center;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #444;
        }
        .total {
            text-align: center;
            margin: 10px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Payment</h1>

        <h3>Books in Order:</h3>
        <ul>
            {% for book in books %}
                <li>{{ book.book_name }} — ₹{{ book.price }}</li>
            {% endfor %}
        </ul>

        <p class="total">Total: ₹{{ total_price }}</p>

        <form method="post">
            {% csrf_token %}
            <label>Cardholder Name:</label>
            <input type="text" name="name" required>

            <label>Card Number:</label>
            <input type="text" name="card" required maxlength="16">

            <label>Expiry Date:</label>
            <input type="text" name="expiry" placeholder="MM/YY" required>

            <label>CVV:</label>
            <input type="password" name="cvv" maxlength="3" required>

            <button type="submit">Pay ₹{{ total_price }}</button>
        </form>
    </div>
</body>
</html>
