{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
            background-color: #f8f8f8;
        }
        h1 {
            text-align: center;
        }
        .book-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .book {
            background: white;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            text-align: center;
        }
        .book h2 {
            margin: 0 0 10px;
        }
        .book p {
            margin: 5px 0;
        }
        .buttons {
            margin-top: 15px;
        }
        button {
            background-color: #222;
            color: white;
            border: none;
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #555;
        }
    </style>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <header><h1>Mini Amazon</h1></header>
  <nav>
    <a href="index.html">Home</a>
    <a href="catalogue.html">Books</a>
     <a href="profile.html">Profile</a>
     <a href="register.html">Register</a>
     <a href="login.html">Login</a>
     <a href="gateway.html">Payment</a>
     <a href="{% url 'view_cart' %}">🛒 View Cart</a>
  </nav>

    <h1>📚 Available Books</h1>

    <div class="book-container">
        {% for book in books %}
        <div class="book">
            <h2>{{ book.book_name }}</h2>
            <p><strong>Author:</strong> {{ book.author_name }}</p>
            <p><strong>Price:</strong> ₹{{ book.price }}</p>
            <div class="buttons">
            <form action="{% url 'add_to_cart' book.id %}" method="post" style="display:inline;">
            {% csrf_token %}
                <button type="submit">Add to Cart</button>
            </form>
            <form action="{% url 'buy_now' book.id %}" method="get" style="display:inline;">
                <button type="submit">Buy Now</button>
            </form>
            </div>
        </div>
        {% empty %}
        <p>No books available yet.</p>
        {% endfor %}
    </div>

</body>
</html>
